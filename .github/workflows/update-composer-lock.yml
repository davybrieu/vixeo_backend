name: Update Composer lock

on:
  push:
    branches: [main]
    paths:
      - 'composer.json'
      - '.github/workflows/update-composer-lock.yml'

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Resolve dependencies
        run: composer update laravel/reverb --with-all-dependencies --no-interaction --prefer-dist --no-scripts
      - name: Commit lock file
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: update Composer lock for Laravel Reverb"
          git push origin HEAD:main
