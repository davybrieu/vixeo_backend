name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP feature and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run email OTP tests
        run: php artisan test tests/Feature/Api/V1/EmailOtpTest.php --compact

      - name: Run profile registration tests
        run: php artisan test tests/Feature/Api/V1/ProfileTest.php --compact

      - name: Run avatar compatibility tests
        run: php artisan test tests/Feature/Api/V1/AvatarTest.php --compact

      - name: Run test suite
        run: php artisan test --compact
