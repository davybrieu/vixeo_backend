name: Scraper tests

on:
  pull_request:
    paths:
      - "scraper/**"
      - ".github/workflows/scraper-tests.yml"
  push:
    branches:
      - main
      - feature/streamflix-provider-port
    paths:
      - "scraper/**"
      - ".github/workflows/scraper-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          find src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
