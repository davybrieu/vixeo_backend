name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vixeo
          POSTGRES_PASSWORD: vixeo
          POSTGRES_DB: vixeo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vixeo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite, redis, intl, mbstring
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Tests (SQLite)
        run: vendor/bin/pest

      - name: Tests (PostgreSQL)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: vixeo_test
          DB_USERNAME: vixeo
          DB_PASSWORD: vixeo
        run: vendor/bin/pest

      - name: OpenAPI spec is up to date
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: vixeo_test
          DB_USERNAME: vixeo
          DB_PASSWORD: vixeo
        run: |
          php artisan migrate --force
          php artisan scramble:export --fail-on-unknown
          git diff --exit-code docs/openapi.json || (echo "::error::docs/openapi.json n'est pas à jour : lancez 'composer openapi' et committez le fichier." && exit 1)
